buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def ritoPackageDir = projectDir.parentFile
def ritoSourceOverride = providers.gradleProperty('ritoFfiSourceDir')
    .orElse(providers.environmentVariable('RITO_FFI_SOURCE_DIR')).orNull
def ritoSourceDir = ritoSourceOverride != null ? rootProject.file(ritoSourceOverride) : new File(ritoPackageDir, 'native/rito')
def ritoBuildFromSource = providers.gradleProperty('ritoBuildFromSource')
    .orElse(providers.environmentVariable('RITO_BUILD_FROM_SOURCE')).orElse('0').get() in ['1', 'true']
ritoBuildFromSource = ritoBuildFromSource || ritoSourceOverride != null
def ritoFfiOutputDir = ritoBuildFromSource ? layout.buildDirectory.dir('rito-ffi').get().asFile : new File(ritoPackageDir, 'prebuilt/android')
def ritoTargetDir = layout.buildDirectory.dir('rito-target').get().asFile

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/RitoNitro+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RitoNitro_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RitoNitro_" + name]).toInteger()
}

android {
  namespace "com.ritonitro"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared",
            "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
            "-DRITO_FFI_SOURCE_DIR=${ritoSourceDir.absolutePath.replace('\\', '/')}",
            "-DRITO_FFI_LIBRARY_ROOT=${ritoFfiOutputDir.absolutePath.replace('\\', '/')}"
        // The library owns its Rust build; the host supplies the matching ABI.
        abiFilters "arm64-v8a"

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
}

// Source packages build Rust inside this module, independently of the host layout.
def buildRitoFfi = tasks.register('buildRitoFfiArm64') {
  onlyIf { ritoBuildFromSource }
  inputs.files(fileTree(ritoSourceDir) { exclude 'target/**' })
  outputs.file(new File(ritoFfiOutputDir, 'arm64-v8a/release/librito_ffi.a'))
  doLast {
    if (!new File(ritoSourceDir, 'Cargo.toml').exists()) {
      throw new GradleException('Rito sources are missing. Run engine:export in the rito-rn repository before packing.')
    }
    providers.exec {
      commandLine 'cargo', '+1.95.0', 'ndk', '-t', 'arm64-v8a',
          'build', '--release', '--locked', '--target-dir', ritoTargetDir.absolutePath,
          '--manifest-path', new File(ritoSourceDir, 'crates/rito-ffi/Cargo.toml').absolutePath
      workingDir ritoSourceDir
    }.result.get().assertNormalExitValue()
    def library = new File(ritoTargetDir, 'aarch64-linux-android/release/librito_ffi.a')
    if (!library.exists()) throw new GradleException('Rust static library was not generated')
    def destination = new File(ritoFfiOutputDir, 'arm64-v8a/release/librito_ffi.a')
    destination.parentFile.mkdirs()
    destination.bytes = library.bytes
  }
}
def verifyRitoPrebuilt = tasks.register('verifyRitoPrebuilt') {
  // Check before CMake configures or reuses a cached native build.
  doLast {
    providers.exec {
      commandLine providers.environmentVariable('NODE_BINARY').orElse('node').get(),
          new File(ritoPackageDir, 'scripts/prebuilt.mjs').absolutePath, 'verify', 'android'
      workingDir ritoPackageDir
    }.result.get().assertNormalExitValue()
  }
}

tasks.configureEach { task ->
  if (task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake')) {
    task.dependsOn(ritoBuildFromSource ? buildRitoFfi : verifyRitoPrebuilt)
  }
}
