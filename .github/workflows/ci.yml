name: Validate adapter and engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: pnpm run engine:export
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: prebuilt
      - run: pnpm run native:verify
      - run: pnpm run check
      - run: pnpm run engine:test
      - run: pnpm pack --pack-destination artifacts
      - run: pnpm run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
  native:
    uses: ./.github/workflows/native-prebuilds.yml
