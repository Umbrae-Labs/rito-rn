name: Propose engine updates
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        branch: [lunar, dev, master]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: node scripts/engine.mjs update
      - run: pnpm run check
      - run: node scripts/engine.mjs test
      - uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ matrix.branch }}
          branch: engine-update/${{ matrix.branch }}
          title: Update pinned Rito engine for ${{ matrix.branch }}
          commit-message: 'chore: update pinned Rito engine'
          add-paths: |
            engine.lock.json
            upstream/rito
          body: |
            Updates the exact engine commit to the head of the fork's ${{ matrix.branch }} branch.
            Check the commits in between for wire protocol and RITODL1 changes; the adapter tests do not run the engine.
            Adapter tests, package validation and Rust tests passed before this PR was created.
            Review native device behavior before adopting the new package in Lunar.
